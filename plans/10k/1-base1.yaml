# 10K plan - Block 1 - Base 1 (wk 1-4): impact tolerance and habit; run/walk with HR cap.
# Push: venv\Scripts\python.exe pipeline\push_workouts.py plans\10k\1-base1.yaml
plan: 10k-base1
workouts:
  - date: 2026-11-26
    name: "10K W1 Thu - Run/walk"
    description: |
      Run/walk: walk breaks are part of the plan, not a failure. Short, light steps; soft surface if possible.

      Warmup
      - Brisk walk 5m

      Run/walk 7x
      - Run easy 1m Z1-Z2 HR
      - Walk 2m

      Cooldown
      - Easy walk 5m
  - date: 2026-11-28
    name: "10K W1 Sat - Long run/walk"
    description: |
      Long aerobic session: time on feet matters, not pace. Walk 1 min whenever HR goes above 140.

      Warmup
      - Brisk walk 5m

      Run/walk 10x
      - Run easy 1m Z1-Z2 HR
      - Walk 2m

      Cooldown
      - Easy walk 5m
