# 10K plan - Block 5 - Build 2 (wk 17-19): longer hills; long trail sessions to 80 min; benchmark repeat.
# Push: venv\Scripts\python.exe pipeline\push_workouts.py plans\10k\5-build2-peak.yaml
plan: 10k-build2-peak
workouts:
  - date: 2027-03-16
    name: "10K W17 Tue - Hill repeats"
    description: |
      Hills: run (or power-hike if it is steep) up a 4-8% slope, strong but controlled, tall posture, short quick steps. Walk back down. HR can go into Z3 on the climbs.

      Warmup
      - Easy jog/walk 10m Z1-Z2 HR

      Hills 8x
      - Uphill 1m Z3 HR
      - Walk down 2m

      Cooldown
      - Easy jog/walk 10m Z1-Z2 HR
  - date: 2027-03-18
    name: "10K W17 Thu - Easy run + strides"
    description: |
      Easy: stay conversational; if HR goes above 140, slow down or walk until it settles. Hike any steep climb.

      Warmup
      - Brisk walk 5m

      Main
      - Run easy 35m Z1-Z2 HR

      Strides 4x
      - Relaxed pickup 15s
      - Walk 45s

      Cooldown
      - Easy walk 5m
  - date: 2027-03-20
