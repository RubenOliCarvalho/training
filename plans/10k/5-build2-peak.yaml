# 10K plan - Block 5 - Build 2 + peak (wk 17-19): threshold cruise intervals; longest runs; benchmark repeat.
# Push: venv\Scripts\python.exe pipeline\push_workouts.py plans\10k\5-build2-peak.yaml
plan: 10k-build2-peak
workouts:
  - date: 2027-03-16
    name: "10K W17 Tue - Threshold intervals"
    description: |
      Cruise intervals at threshold: hard but controlled, even effort on every rep.

      Warmup
      - Easy jog/walk 10m Z1-Z2 HR

      Main set 4x
      - Cruise 6m Z4 HR
      - Easy jog/walk 2m

      Cooldown
      - Easy jog/walk 10m Z1-Z2 HR
  - date: 2027-03-18
    name: "10K W17 Thu - Easy run + strides"
    description: |
      Easy: stay conversational; if HR goes above 140, slow down or walk until it settles.

      Warmup
      - Brisk walk 5m

      Main
      - Run easy 35m Z1-Z2 HR

      Strides 4x
      - Relaxed pickup 15s
      - Walk 45s

      Cooldown
      - Easy walk 5m
