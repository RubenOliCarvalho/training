# 10K plan - Block 4 - Build 1 (wk 13-16): continuous running; hill repeats; long trail sessions to 60 min.
# Push: venv\Scripts\python.exe pipeline\push_workouts.py plans\10k\4-build1.yaml
plan: 10k-build1
workouts:
  - date: 2027-02-16
    name: "10K W13 Tue - Hill repeats"
    description: |
      Hills: run (or power-hike if it is steep) up a 4-8% slope, strong but controlled, tall posture, short quick steps. Walk back down. HR can go into Z3 on the climbs.

      Warmup
      - Easy jog/walk 10m Z1-Z2 HR

      Hills 6x
      - Uphill 45s Z3 HR
      - Walk down 2m

      Cooldown
      - Easy jog/walk 10m Z1-Z2 HR
  - date: 2027-02-18
    name: "10K W13 Thu - Easy run"
    description: |
      Easy: stay conversational; if HR goes above 148, slow down or walk until it settles. Hike any steep climb.

      Warmup
      - Brisk walk 5m

      Main
      - Run easy 25m Z1-Z2 HR

      Cooldown
      - Easy walk 5m
  - date: 2027-02-20
    name: "10K W13 Sat - Long run"
    description: |
      Long trail session: time on feet matters, not pace. Hike every climb, walk technical descents, walk 1 min whenever HR goes above 148.

      Warmup
      - Brisk walk 5m

      Main
      - Run easy 45m Z1-Z2 HR

      Cooldown
      - Easy walk 5m
