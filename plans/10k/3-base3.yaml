# 10K plan - Block 3 - Base 3 (wk 9-12): towards 30 min continuous; drills; benchmark in wk 12.
# Push: venv\Scripts\python.exe pipeline\push_workouts.py plans\10k\3-base3.yaml
plan: 10k-base3
workouts:
  - date: 2027-01-19
    name: "10K W9 Tue - Drills + run/walk + strides"
    description: |
      Run/walk: walk breaks are part of the plan, not a failure. Short, light steps; hike the climbs, walk technical descents.

      Warmup
      - Brisk walk 5m

      Drills 2x
      - High knees 20s
      - Walk 40s
      - Butt kicks 20s
      - Walk 40s

      Run/walk 4x
      - Run easy 6m Z1-Z2 HR
      - Walk 1m

      Strides 4x
      - Relaxed pickup 15s
      - Walk 45s

      Cooldown
      - Easy walk 5m
