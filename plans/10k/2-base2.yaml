# 10K plan - Block 2 - Base 2 (wk 5-8): longer run segments, first strides.
# Push: venv\Scripts\python.exe pipeline\push_workouts.py plans\10k\2-base2.yaml
plan: 10k-base2
workouts:
  - date: 2026-12-22
    name: "10K W5 Tue - Run/walk + strides"
    description: |
      Run/walk: walk breaks are part of the plan, not a failure. Short, light steps; hike the climbs, walk technical descents.

      Warmup
      - Brisk walk 5m

      Run/walk 5x
      - Run easy 3m Z1-Z2 HR
      - Walk 2m

      Strides 4x
      - Relaxed pickup 15s
      - Walk 45s

      Cooldown
      - Easy walk 5m
