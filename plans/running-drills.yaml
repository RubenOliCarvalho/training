# Running drills session (warm-up, drills, strides, cool-down).
# Push: venv\Scripts\python.exe pipeline\push_workouts.py plans\running-drills.yaml
plan: running-drills
workouts:
  - date: 2026-11-19
    name: Running drills + strides
    description: |
      Drills: short quick steps, stay relaxed. High knees: thighs to parallel, fast turnover. Butt kicks: heels to butt, knees forward. Skipping: high knee drive, run-like arm swing. Drills and strides are timed (20 s each); the watch moves on automatically. Carioca: face sideways, alternate the trailing leg in front and behind. Strides: build smoothly from easy to ~5k effort (RPE 3 to 8), relaxed shoulders, neck and jaw.

      Warmup
      - Easy jog/walk 8m Z1-Z2 HR

      High knees 3x
      - H Knees 20s
      - Easy jog/walk 45s

      Butt kicks 3x
      - B Kicks 20s
      - Easy jog/walk 45s

      Skipping 3x
      - Skip 20s
      - Easy jog/walk 45s

      Carioca 4x
      - Carioca R 20s
      - Rest 20s
      - Carioca L 20s
      - Rest 20s

      Strides 3x
      - Strides 20s
      - Easy jog/walk 45s

      HB Knees 1x
      - H Knees 20s
      - B Kicks 20s

      Cooldown
      - Easy walk/jog 5m Z1-Z2 HR
