  - date: 2026-11-23
    name: "Bike W1 Mon - FTP ramp test"
    type: VirtualRide
    description: |
      FTP ramp test. ERG holds each step; ride until you can no longer hold the watts at a steady cadence, then stop. FTP = 75% of the last FULL minute you completed (e.g. last full step 190 W -> FTP 142 W). Send Claude the result: FTP gets updated in intervals.icu (and on the Edge) and the plan rescales.

      Warmup
      - Warm up 10m ramp 45%-65% 90rpm
      - Easy 3m 50% 90rpm

      Ramp test
      - Ramp 1m 70w
      - Ramp 1m 85w
      - Ramp 1m 100w
      - Ramp 1m 115w
      - Ramp 1m 130w
      - Ramp 1m 145w
      - Ramp 1m 160w
      - Ramp 1m 175w
