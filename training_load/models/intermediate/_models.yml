version: 2

models:
  - name: int_training_load_daily
    description: >
      Daily Fitness (ctl), Fatigue (atl) and Form (tsb) taken directly from the
      intervals.icu wellness endpoint, so values match intervals.icu/fitness. Only
      daily_training_load is computed here (sum of that day's activities). If
      intervals.icu has no record for a day, the last known ctl/atl is carried
      forward. Replaces the earlier self-computed EWMA model, which drifted from
      intervals.icu on multi-activity days (see git history).
    columns:
      - name: calendar_date
        description: One row per calendar day, from the earliest available activity date to today. No gaps — every day is represented, including rest days with zero training load.
        tests: [unique, not_null]
      - name: daily_training_load
        description: Sum of training_load across all activities on this calendar day. Zero on rest days, never null.
      - name: ctl
        description: Fitness, as reported by intervals.icu for this date.
        tests: [not_null]
      - name: atl
        description: Fatigue, as reported by intervals.icu for this date.
        tests: [not_null]
      - name: tsb
        description: Form = ctl - atl for the same date, matching how intervals.icu displays it. Previously this was the prior day's ctl minus atl, so values shift by about a day.
