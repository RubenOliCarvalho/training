version: 2

models:
  - name: mart_daily_training
    columns:
      - name: calendar_date
        tests: [unique, not_null]
      - name: body_fat_pct
        description: Forward-filled from the most recent weight log with a body fat reading.
      - name: muscle_mass_kg
        description: Muscle mass in kg. Forward-filled from the most recent weight log with a muscle mass reading.
      - name: fat_mass_kg
        description: weight_kg * body_fat_pct / 100 of the same reading. Forward-filled from the most recent reading with body fat.
      - name: fat_free_mass_kg
        description: weight_kg - fat_mass_kg of the same reading. Forward-filled like fat_mass_kg.
      - name: sleep_hours
        description: From intervals.icu wellness sleepSecs (Garmin), dated the morning of waking.
      - name: resting_hr_7d_avg
        description: Mean of the last 7 calendar days (incl. today); null if fewer than 4 readings. Same rule for hrv_7d_avg and sleep_hours_7d_avg.
      - name: is_weigh_in_day
        description: True on days with a weight log entry (the other body columns are forward-filled).
        tests: [not_null]
  - name: mart_weekly_training
    columns:
      - name: week_start
        tests: [unique, not_null]
  - name: mart_monthly_training
    columns:
      - name: month
        tests: [unique, not_null]
  - name: mart_yearly_training
    description: One row per calendar year, for the dashboard's Year in Review tab.
    columns:
      - name: year
        tests: [unique, not_null]
  - name: mart_activity_diary
    columns:
      - name: activity_id
        tests: [unique, not_null]
  - name: mart_monthly_zone_times
    description: Seconds/hours/% per heart-rate and power zone per month (from intervals.icu zone times).
    columns:
      - name: zone_key
        tests: [unique, not_null]
      - name: zone_type
        tests:
          - accepted_values:
              arguments:
                values: ['hr', 'power']
  - name: mart_yearly_zone_times
    description: Seconds/hours/% per heart-rate and power zone per year (from intervals.icu zone times).
    columns:
      - name: zone_key
        tests: [unique, not_null]
