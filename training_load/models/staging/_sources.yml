version: 2

sources:
  - name: staging
    schema: staging
    description: Raw data landed directly by the Python pipeline scripts (pipeline/ingest_intervals.py, pipeline/ingest_weather.py). No transformations applied — see staging models for the first cleaning layer.
    tables:
      - name: intervals_activities_raw
        description: One row per activity pulled from the intervals.icu API, upserted on activity_id.
        loaded_at_field: pulled_at
      - name: weather_daily
        description: One row per calendar day of weather for the fixed home location, pulled from Open-Meteo's archive API, upserted on weather_date.
        loaded_at_field: pulled_at
      - name: weight_log_raw
        description: One row per calendar day of weight logs, upserted on log_date.
        loaded_at_field: logged_at
      - name: intervals_events_raw
        description: intervals.icu calendar events (planned workouts etc.) in a rolling window, mirrored by pipeline/ingest_events.py (rows of deleted events are removed).
        loaded_at_field: pulled_at
      - name: activity_power_bests
        description: Best 1/5/20-minute power per ride from the intervals.icu power curve, landed by pipeline/ingest_power_bests.py.
        loaded_at_field: pulled_at
      - name: intervals_wellness_raw
        description: One row per calendar day of intervals.icu wellness data (Fitness/Fatigue/ramp rate), upserted on wellness_date. Landed by pipeline/ingest_wellness.py. Weight and body composition come from weight_log_raw, not from here.
        loaded_at_field: pulled_at
